<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
        <link rel="icon" href="img/favicon/favicon.ico" sizes="any" />
        <link rel="icon" href="img/favicon/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="img/favicon/icon-192.png" type="image/png" sizes="192x192" />
        <link rel="apple-touch-icon" href="img/favicon/apple-touch-icon.png" />
        <link rel="manifest" href="img/favicon/site.webmanifest" />
        <meta name="theme-color" content="#17181c" />
    </head>
    <body>
        <div class="wrapper">
            <header>
                <img src="img/logo.svg" alt="News Portal Logo" width="40" height="40">
                <h1>News Portal</h1>
            </header>
            <main>
                <div class="sources buttons"></div>
                <div class="news"></div>
            </main>
            <footer>
                <div class="footer__legal">
                    <p class="copyright">
                        Copyright <a class="link" href="https://newsapi.org">NewsAPI</a>
                    </p>
                    <p class="year">2026</p>
                </div>
                <div class="footer__links">
                    <a class="link" href="https://github.com/MilaRut" target="_blank" rel="noopener noreferrer">
                        <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M15.9523 0C7.1311 0 0 7.33333 0 16.4057C0 23.6577 4.56914 29.7963 10.9078 31.969C11.7002 32.1323 11.9905 31.616 11.9905 31.1817C11.9905 30.8013 11.9644 29.4977 11.9644 28.1393C7.52686 29.1173 6.60278 26.1837 6.60278 26.1837C5.88963 24.2823 4.83298 23.7937 4.83298 23.7937C3.38057 22.7887 4.93878 22.7887 4.93878 22.7887C6.54988 22.8973 7.39527 24.4727 7.39527 24.4727C8.82123 26.9713 11.119 26.2653 12.0434 25.8307C12.1753 24.7713 12.5982 24.038 13.0472 23.6307C9.50792 23.2503 5.78416 21.838 5.78416 15.5363C5.78416 13.7437 6.41763 12.277 7.42139 11.1363C7.26302 10.729 6.70825 9.04467 7.58008 6.79033C7.58008 6.79033 8.92702 6.35567 11.9641 8.47433C13.2644 8.11522 14.6053 7.93254 15.9523 7.931C17.2993 7.931 18.6723 8.12133 19.9402 8.47433C22.9776 6.35567 24.3246 6.79033 24.3246 6.79033C25.1964 9.04467 24.6413 10.729 24.4829 11.1363C25.5131 12.277 26.1205 13.7437 26.1205 15.5363C26.1205 21.838 22.3967 23.223 18.831 23.6307C19.4122 24.1467 19.9138 25.1243 19.9138 26.6727C19.9138 28.8727 19.8877 30.6383 19.8877 31.1813C19.8877 31.616 20.1783 32.1323 20.9705 31.9693C27.3091 29.796 31.8782 23.6577 31.8782 16.4057C31.9043 7.33333 24.7471 0 15.9523 0Z" fill="currentColor"/>
                        </svg>
                        <span>MilaRut</span>
                    </a>
                    <a class="link" href="https://rs.school/courses/javascript" target="_blank" rel="nofollow noreferrer noopener">
                        <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" width="20" height="20">
                        <span>RS School</span>
                    </a>
                </div>
            </footer>
        </div>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
